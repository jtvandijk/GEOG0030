project:
  type: website
  output-dir: docs

lang: en

execute:
  freeze: false
  cache: false

format:
  html:
    theme:
      light: flatly
      dark:  darkly
    callout-appearance: simple
    css: assets/styles.css
    toc: true
    toc-depth: 4
    smooth-scroll: true
    highlight-style: atom-one
    number-sections: true
    number-depth: 4
    pagetitle: "{{< var meta.title >}}"

website:
  repo-url: https://github.com/jtvandijk/GEOG0030
  repo-actions: [issue]
  page-navigation: true
  page-footer:
    center: "Course material by [Justin van Dijk](https://www.mappingdutchman.com). Available under [CC BY-SA 4.0](https://creativecommons.org/licenses/by-sa/4.0/)."
  search:
    location: sidebar
    type: overlay
  sidebar:
    style: floating
    collapse-level: 2
    logo: assets/logo.svg
    tools:
      - icon: github
        href: https://github.com/jtvandijk/GEOG0030
    contents:
      - section: "Module overview"
        contents:
          text: "Welcome"
          file: 00-index.qmd
      - section: "Core Spatial Analysis"
        contents:
          - text: "1 Reproducible Spatial Analysis"
            href: 01-spatial.qmd
          - text: "2 Spatial Queries and Geometric Operations"
            href: 02-operations.qmd
          - text: "3 Point Pattern Analysis"
            href: 03-point-pattern.qmd
          - text: "4 Spatial Autocorrelation"
            href: 04-autocorrelation.qmd
          - text: "5 Spatial Models"
            href: 05-models.qmd
      - section: "Applied Spatial Analysis"
        contents:
          - text: "6 Raster Data Analysis"
            href: 06-raster.qmd
          - text: "7 Geodemographic Classification"
            href: 07-geodemographics.qmd
          - text: "8 Accessibility Analysis"
            href: 08-network.qmd
      - section: "Data visualisation"
        contents: 
          - text: "9 Beyond the Choropleth"
            href: 09-maps.qmd
          - text: "10 Complex Visualisations"
            href: 10-datavis.qmd
      - section: "Additional Resources"
        contents:
        - text: "11 Data Sources"
          href: 11-data.qmd

editor: source

